# Test Automation Configuration File
# Black Box Testing Suite - Cucumber + Selenium + RestAssured

# ============================================
# Base URLs
# ============================================
base.url=http://localhost:8080
api.base.url=http://localhost:8080
ui.base.url=http://localhost:8080/ui

# ============================================
# Test User Credentials
# ============================================
# Admin User
admin.username=admin
admin.password=admin123

# Regular/Test User
regular.username=testuser
regular.password=test123

# ============================================
# WebDriver Timeouts (in seconds)
# ============================================
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# ============================================
# Browser Configuration
# ============================================
# Supported values: chrome, firefox, edge, safari
browser=chrome

# ============================================
# Additional Configuration Options
# ============================================
# Enable headless mode (true/false)
headless.mode=false

# Screenshot on failure (true/false)
screenshot.on.failure=true

# Maximum retry attempts for flaky tests
max.retry.count=0
